<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>square test</title>
    <link href="./style.css" rel="stylesheet" type="text/css" />
  </head>

  <body>
    <div id="mySidenav" class="sidenav">
      <a href="javascript:void(0)" class="closebtn" onclick="closeNav()"
        >&times;</a
      >

      <a href="#square">go to square</a> <br />
      <!-- <a href="#myRange">go to controls</a> <br /> -->

      <input
        type="range"
        min="-90"
        max="90"
        value="0"
        class="slider"
        id="cannonAngle"
      />
      <span id="cannonAngValue">0</span> <br />

      <input
        type="text"
        id="enterweapon"
        onblur="typing=false"
        onfocus="typing=true"
        value="c"
      />
      <button onclick="applyWeapon()">apply weapon</button> <br />
      <br />
      <button
        onclick="setFactoryProcessIn_Out(storageUI.getStorage(), 'iron_ore')"
      >
        Start up magic_smelter#1
      </button>
      <br />
      <button
        onclick="addFactoryStorage('magic_smelter#1', {name: 'iron_ore', size: 10, unique: false, mult: 1}, 1)"
      >
        Add iron ore to magic_smelter#1
      </button>
      <br />
      <button
        onclick="setFactoryProcessOut_Free(storageUI.getStorage(), 'iron_ore')"
      >
        Start up magic_iron_ore_machine#1
      </button>
      <br />
      <button
        onclick="makeItem('weapon_c_part1'); makeItem('weapon_c_part2'); makeItem('weapon_c_part3');"
      >
        Spawn weapon C parts
      </button>
      <br />
      <button onclick="assembleItem('weapon_c')">Assemble weapon C</button>
      <br />
      <button
        onclick="makeItem('cube', undefined, undefined, undefined, 1, undefined, 'iron')"
      >
        Make iron cube
      </button>
      <br />
      <button
        onclick='addToAttachments(inventoryItems.weapon_c_part1.iron, "upper", {
            name: "weapon_c_part2",
            unique: false,
            mult: 1,
            material: "iron",
            attachments: {
              barrel: {
                weapon_c_part3: {
                  name: "weapon_c_part3",
                  unique: false,
                  mult: 1,
                  material: "iron",
                },
              },
            },
          },
        )'
      >
        Attach part2 to weapon c part1
      </button>
      <br />
      <button
        onclick='console.log(removeFromAttachments(inventoryItems.weapon_c_part1.iron,"upper"))'
      >
        Remove weapon c part2 from weapon c part1
      </button>
      <br />
      <button onclick="">more debug buttons coming soon</button> <br />
      <button onclick="">more debug buttons coming soon</button> <br />
      <button onclick="">more debug buttons coming soon</button> <br />
    </div>

    <div id="storageaccessUI" class="sidenav">
      Press "G" on a factory to access its storage <br />
      <br />
      Interacting with
      <pre id="storagename" style="display: inline">(not initialised yet)</pre>
      : <br />
      <br />
      Available processes: <br />
      <div id="processcontainer"></div>
      <br />
      Storage: <br />
      <div id="accessedtable" class="tablecontainer"></div>
    </div>

    <div id="inventory">
      assembly: <br />
      <div id="assemblybuttons"></div>
      items: <br />
      <div id="itemtable" class="tablecontainer"></div>
      old items (raw json) (close and open inventory to refresh): <br />
      <pre id="itemcontainer"></pre>
    </div>
